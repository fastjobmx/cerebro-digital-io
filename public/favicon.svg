<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070014"/>
      <stop offset="100%" stop-color="#110030"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B2CFF"/>
      <stop offset="45%" stop-color="#E600FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E600FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square with slight rounding -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#brainGrad)" stroke-opacity="0.5" stroke-width="1"/>

  <g filter="url(#glow)" transform="translate(12, 10)">
    <!-- Outer orbit lines -->
    <ellipse cx="20" cy="22" rx="22" ry="7" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="0.8" transform="rotate(-15 20 22)"/>
    <ellipse cx="20" cy="22" rx="22" ry="7" fill="none" stroke="#E600FF" stroke-opacity="0.6" stroke-width="0.8" transform="rotate(15 20 22)"/>

    <!-- Left hemisphere -->
    <path d="M3 23 C3 11, 14 5, 17 5 C18.5 2, 22 1, 24.5 5 C27 8, 29.5 10, 29.5 14 C32 13, 37 15, 37 20 C37 24, 34 26, 30 26 L30 32 C30 34.5, 28.5 36, 26 37 C24.5 39.5, 21 39.5, 20 37 L14 37 L14 26 L9 26 C4 26, 3 26, 3 23 Z"
          fill="url(#brainGrad)" opacity="0.95"/>
    <!-- Right hemisphere -->
    <path d="M37 23 C37 11, 26 5, 23 5 C21.5 2, 18 1, 15.5 5 C13 8, 10.5 10, 10.5 14 C8 13, 3 15, 3 20 C3 24, 6 26, 10 26 L10 32 C10 34.5, 11.5 36, 14 37 C15.5 39.5, 19 39.5, 20 37 L26 37 L26 26 L31 26 C36 26, 37 26, 37 23 Z"
          fill="url(#brainGrad)" opacity="0.92"/>

    <!-- Circuit nodes -->
    <circle cx="14" cy="12" r="1.4" fill="#00E5FF"/>
    <circle cx="22" cy="9" r="1.6" fill="#E600FF"/>
    <circle cx="30" cy="9" r="1.6" fill="#00E5FF"/>
    <circle cx="37" cy="12" r="1.4" fill="#E600FF"/>
    <circle cx="16" cy="21" r="1.2" fill="#FFFFFF"/>
    <circle cx="27" cy="19" r="1.3" fill="#FFFFFF"/>
    <circle cx="35" cy="21" r="1.2" fill="#FFFFFF"/>
    <circle cx="19" cy="30" r="1.2" fill="#00E5FF"/>
    <circle cx="32" cy="30" r="1.2" fill="#E600FF"/>

    <!-- Circuit paths -->
    <path d="M16 21 L22 9 L27 19" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.7" fill="none"/>
    <path d="M27 19 L30 9 L35 21" stroke="#E600FF" stroke-width="0.7" stroke-opacity="0.7" fill="none"/>

    <!-- Central core glow -->
    <circle cx="20" cy="19" r="6" fill="url(#core)"/>
  </g>
</svg>
