<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070014"/>
      <stop offset="100%" stop-color="#110030"/>
    </linearGradient>
    <linearGradient id="brainGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B2CFF"/>
      <stop offset="45%" stop-color="#E600FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="core2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E600FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="180" height="180" rx="38" fill="url(#bg2)"/>
  <rect width="180" height="180" rx="38" fill="none" stroke="url(#brainGrad2)" stroke-opacity="0.5" stroke-width="1.5"/>

  <g filter="url(#glow2)" transform="translate(34, 30)">
    <!-- orbits -->
    <ellipse cx="56" cy="60" rx="62" ry="18" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" transform="rotate(-15 56 60)"/>
    <ellipse cx="56" cy="60" rx="62" ry="18" fill="none" stroke="#E600FF" stroke-opacity="0.6" stroke-width="1.2" transform="rotate(15 56 60)"/>

    <!-- left -->
    <path d="M8 63 C8 31, 39 14, 48 14 C52 6, 62 3, 69 14 C77 22, 84 28, 84 39 C91 36, 105 42, 105 56 C105 67, 96 73, 84 73 L84 90 C84 97, 80 101, 73 104 C69 111, 59 111, 56 104 L39 104 L39 73 L25 73 C11 73, 8 73, 8 63 Z"
      fill="url(#brainGrad2)" opacity="0.95"/>
    <!-- right -->
    <path d="M104 63 C104 31, 73 14, 64 14 C60 6, 50 3, 43 14 C35 22, 28 28, 28 39 C21 36, 7 42, 7 56 C7 67, 16 73, 28 73 L28 90 C28 97, 32 101, 39 104 C43 111, 53 111, 56 104 L73 104 L73 73 L87 73 C101 73, 104 73, 104 63 Z"
      fill="url(#brainGrad2)" opacity="0.92"/>

    <!-- circuit nodes -->
    <circle cx="40" cy="34" r="3.2" fill="#00E5FF"/>
    <circle cx="62" cy="26" r="3.8" fill="#E600FF"/>
    <circle cx="84" cy="26" r="3.8" fill="#00E5FF"/>
    <circle cx="103" cy="34" r="3.2" fill="#E600FF"/>
    <circle cx="46" cy="58" r="2.8" fill="#FFFFFF"/>
    <circle cx="77" cy="53" r="3.2" fill="#FFFFFF"/>
    <circle cx="98" cy="58" r="2.8" fill="#FFFFFF"/>
    <circle cx="53" cy="84" r="2.8" fill="#00E5FF"/>
    <circle cx="90" cy="84" r="2.8" fill="#E600FF"/>

    <!-- circuit lines -->
    <path d="M46 58 L62 26 L77 53" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.75" fill="none"/>
    <path d="M77 53 L84 26 L98 58" stroke="#E600FF" stroke-width="1.2" stroke-opacity="0.75" fill="none"/>

    <!-- IO mark -->
    <g transform="translate(86, 128)">
      <rect x="0" y="0" width="4" height="22" rx="2" fill="#00E5FF"/>
      <circle cx="20" cy="10" r="11" stroke="url(#brainGrad2)" stroke-width="2.8" fill="none"/>
      <circle cx="20" cy="10" r="4.5" fill="#E600FF" opacity="0.75"/>
    </g>

    <!-- core -->
    <circle cx="56" cy="54" r="17" fill="url(#core2)"/>
  </g>
</svg>
