    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Carga no bloqueante: texto visible inmediato con fuente del sistema, swap al llegar -->
    <!-- Inter/Sora: display=swap (texto legible siempre). Michroma/JetBrains Mono: display=optional (solo si carga rápido, evita FOIT en decorativas) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@400;500&display=optional" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@400;500&display=optional">
    </noscript>
    <!-- Sin JavaScript no corren las animaciones que revelan la portada -->
    <noscript><style>#inicio .opacity-0, [data-h] { opacity: 1 !important; }</style></noscript>
    <!-- Primera visita: fondo y logo tenue pintados antes del JavaScript; el preloader los reemplaza al montarse -->
    <style>
      html.is-preload::before, html.is-preload::after { content: ''; position: fixed; inset: 0; z-index: 199; }
      html.is-preload::before { background: #05010d; }
      html.is-preload::after { background: url('/brand/logo-full.webp') center / min(72vw, 380px) no-repeat; opacity: 0.16; }
    </style>
    <script>
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('cdio-visited')) {
          var html = document.documentElement
          html.classList.add('is-preload', 'is-loading')
          var logo = document.createElement('link')
          logo.rel = 'preload'
          logo.as = 'image'
          logo.href = '/brand/logo-full.webp'
          logo.fetchPriority = 'high'
          document.head.appendChild(logo)
          // Si el JavaScript no llega a cargar, la página no queda cubierta.
          setTimeout(function () {
            html.classList.remove('is-preload', 'is-loading')
          }, 10000)
        }
      } catch (e) {}
    </script>
