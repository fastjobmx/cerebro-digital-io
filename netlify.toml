# Sitio multipágina (no SPA): cada ruta tiene su propio HTML y Netlify sirve 404.html
# en las rutas inexistentes. No agregar "/* /index.html 200": ocultaría la página 404.
[build]
  command = "npm run build"
  publish = "dist"

# Una sola URL pública: el subdominio de Netlify redirige al dominio canónico.
[[redirects]]
  from = "https://cerebrodigitalio.netlify.app/*"
  to = "https://cerebrodigitalio.qd.je/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
